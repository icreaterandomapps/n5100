<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROM Room — GT-N5100</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #d7d7d7;
        color: #111;
        font-family: Tahoma, Verdana, Arial, sans-serif;
        font-size: 13px;
    }

    .topbar {
        height: 48px;
        background: linear-gradient(#444, #202020);
        border-bottom: 3px solid #111;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 18px;
        box-shadow: 0 2px 5px #777;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: -1px;
        text-shadow: 1px 1px #000;
    }

    .logo span { color: #72b7ff; }

    .wrap {
        width: min(900px, calc(100% - 24px));
        margin: 22px auto 40px;
    }

    .titlebox {
        background: #f4f4f4;
        border: 1px solid #999;
        border-top: 4px solid #333;
        padding: 14px 16px;
        box-shadow: 0 1px 3px #aaa;
        margin-bottom: 14px;
    }

    h1 {
        margin: 0 0 4px;
        font-size: 22px;
    }

    .subtitle {
        color: #666;
        font-size: 12px;
    }

    .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }

    .search {
        flex: 1;
        height: 34px;
        border: 1px solid #888;
        padding: 7px 9px;
        font-family: Tahoma, Verdana, sans-serif;
        font-size: 13px;
        background: white;
        box-shadow: inset 0 1px 2px #ddd;
    }

    .box {
        border: 1px solid #888;
        background: #eee;
        box-shadow: 0 1px 3px #aaa;
    }

    .boxhead {
        background: linear-gradient(#555, #303030);
        color: white;
        padding: 8px 11px;
        font-weight: bold;
        border-bottom: 1px solid #111;
        text-shadow: 1px 1px #000;
    }

    .rom-row {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 8px 11px 8px 14px;
        background: #fafafa;
        border-bottom: 1px solid #bbb;
    }

    .rom-row:last-child { border-bottom: 0; }

    .rom-name {
        font-size: 14px;
        font-weight: bold;
        color: #222;
    }

    .download {
        flex: 0 0 auto;
        display: inline-block;
        padding: 8px 17px;
        min-width: 105px;
        text-align: center;
        text-decoration: none;
        color: white;
        font-weight: bold;
        font-size: 12px;
        border: 1px solid #174f83;
        border-radius: 2px;
        background: linear-gradient(#4da2e8, #1c6da9);
        box-shadow: inset 0 1px rgba(255,255,255,.35), 0 1px 2px #aaa;
    }

    .download:hover {
        background: linear-gradient(#65b5f2, #257fbe);
    }

    .download:active {
        position: relative;
        top: 1px;
        box-shadow: inset 0 1px 3px #15547e;
    }

    .empty {
        display: none;
        padding: 18px;
        text-align: center;
        color: #777;
        background: #fafafa;
    }

    .footer {
        margin-top: 12px;
        color: #777;
        font-size: 11px;
        text-align: center;
    }

    @media (max-width: 520px) {
        .rom-row { padding-left: 10px; }
        .download { min-width: 90px; padding: 8px 10px; }
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">ROM <span>ROOM</span></div>
</div>

<div class="wrap">
    <div class="titlebox">
        <h1>Samsung Galaxy Note 8.0 — GT-N5100</h1>
        <div class="subtitle">Custom ROM archive / n5100</div>
    </div>

    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search ROMs..."
            autocomplete="off"
        >
    </div>

    <div class="box">
        <div class="boxhead">Available ROMs</div>

        <div class="rom-row" data-name="LineageOS">
            <div class="rom-name">LineageOS</div>
            <a class="download"
               href="https://androidfilehost.com/?w=files&flid=323272"
               target="_blank"
               rel="noopener">DOWNLOAD</a>
        </div>

        <div class="rom-row" data-name="SlimRoms 5.1.1">
            <div class="rom-name">SlimRoms 5.1.1</div>
            <a class="download"
               href="https://androidfilehost.com/?w=files&flid=31880"
               target="_blank"
               rel="noopener">DOWNLOAD</a>
        </div>

        <div class="rom-row" data-name="SlimRoms Archive">
            <div class="rom-name">SlimRoms Archive</div>
            <a class="download"
               href="https://web.archive.org/web/20180901152459/http://slimroms.net/index.php/downloads/dlsearch/viewcategory/1215-n5100"
               target="_blank"
               rel="noopener">DOWNLOAD</a>
        </div>

        <div class="rom-row" data-name="CyanogenMod">
            <div class="rom-name">CyanogenMod</div>
            <a class="download"
               href="https://web.archive.org/web/20161120050446/http://download.cyanogenmod.org/?device=n5100"
               target="_blank"
               rel="noopener">DOWNLOAD</a>
        </div>

        <div class="rom-row" data-name="VanirAOSP">
            <div class="rom-name">VanirAOSP</div>
            <a class="download"
               href="https://web.archive.org/web/20181228001220/http://www.emccann.net/nuclearmistake/VanirAOSPNightlies/n5100/"
               target="_blank"
               rel="noopener">DOWNLOAD</a>
        </div>

        <div id="empty" class="empty">No ROMs found.</div>
    </div>

    <div class="footer">
        ROM Room · GT-N5100 · n5100
    </div>
</div>

<script>
const search = document.getElementById("search");
const rows = [...document.querySelectorAll(".rom-row")];
const empty = document.getElementById("empty");

search.addEventListener("input", () => {
    const query = search.value.trim().toLowerCase();
    let visible = 0;

    rows.forEach(row => {
        const match = row.dataset.name.toLowerCase().includes(query);
        row.style.display = match ? "flex" : "none";
        if (match) visible++;
    });

    empty.style.display = visible ? "none" : "block";
});
</script>

</body>
</html>
